name: CI

# No schedule: a cron run without code changes is activity without progress.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux plus Windows. macOS would duplicate Linux for pure Python -- same POSIX
        # semantics, same path handling -- whereas Windows is where the real portability risk is,
        # and is unblocked by this commit removing the module-scope fcntl/termios imports.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync

      - run: uv run pytest -q

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync

      - run: uv run ruff check

      - run: uv run ruff format --check

      # ty has no --strict; --error-on-warning is the equivalent gate.
      - run: uv run ty check --error-on-warning

  build:
    name: build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Install the built wheel and smoke-test the entry point
        run: |
          uv tool install dist/*.whl
          lenticrypt --version
          uv tool uninstall lenticrypt

      - name: Check the editable install path
        run: uv tool install -e .
